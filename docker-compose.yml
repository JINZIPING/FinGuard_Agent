services:
  frontend:
    build:
      context: ./frontend
      # Omit REACT_APP_API_BASE_URL so the app defaults to the relative
      # path '/api', which Nginx then proxies to the backend. This makes
      # the image work on any deployment domain without rebuilding.
    ports:
      - "13000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      CORS_ORIGINS: "*"
      BACKEND_DB_PATH: /app/data/backend.db
      DATABASE_URL: postgresql://finguard:finguard@postgres:5432/finguard
      AI_SYSTEM_URL: http://ai_system:8000
      AI_SYSTEM_TIMEOUT_SECONDS: "120"
    ports:
      - "15050:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai_system:
        condition: service_started
    volumes:
      - backend_data:/app/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finguard
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard -d finguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai_system:
    build:
      context: .
      dockerfile: ai_system/Dockerfile
    env_file:
      - path: ./ai_system/.env
        required: false
    environment:
      CHROMA_PERSIST_DIR: /app/data/chroma
    ports:
      - "18000:8000"
    volumes:
      - ai_system_data:/app/data

volumes:
  backend_data:
  ai_system_data:
  postgres_data:
