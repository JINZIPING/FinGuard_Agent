services:
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE_URL: http://localhost:15050
    ports:
      - "13000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
    environment:
      CORS_ORIGINS: http://localhost:13000,http://localhost:3000
    ports:
      - "15050:5000"
    depends_on:
      - ai_system
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai_system:
    build:
      context: .
      dockerfile: ai_system/Dockerfile
    env_file:
      - ./ai_system/.env
    ports:
      - "18000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
