services:
  frontend:
    build:
      context: ./frontend
      # Omit REACT_APP_API_BASE_URL so the app defaults to the relative
      # path '/api', which Nginx then proxies to the backend. This makes
      # the image work on any deployment domain without rebuilding.
    ports:
      - "13000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
    environment:
      CORS_ORIGINS: "*"
      BACKEND_DB_PATH: /app/data/backend.db
      DATABASE_URL: postgresql://finguard:finguard@postgres:5432/finguard
      AI_SYSTEM_URL: http://ai_system:8000
      AI_SYSTEM_TIMEOUT_SECONDS: "120"
    ports:
      - "15050:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai_system:
        condition: service_started
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finguard
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard -d finguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai_system:
    build:
      context: .
      dockerfile: ai_system/Dockerfile
    env_file:
      - path: ./ai_system/.env
        required: false
    environment:
      CHROMA_PERSIST_DIR: /app/data/chroma
      GROQ_MODEL: openai/gpt-oss-120b
      LANGSMITH_TRACING: "true"
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      LANGSMITH_PROJECT: finguard
    ports:
      - "18000:8000"
    volumes:
      - ./ai_system/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
