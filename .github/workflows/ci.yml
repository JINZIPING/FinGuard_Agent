name: FinGuard CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ai_system/requirements.txt
          pip install pytest

      - name: Run automated tests
        env:
          AI_RESPONSE_MODE: mock
          OPENAI_API_KEY: test-key
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - python-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install seed-script dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed deterministic demo data
        env:
          BACKEND_DB_PATH: ${{ github.workspace }}/backend/data/backend.db
        run: python scripts/seed_demo_data.py --reset

      - name: Write ai_system environment
        run: |
          cat > ai_system/.env <<'EOF'
          OPENAI_API_KEY=test-key
          OPENAI_MODEL=gpt-5.4-mini
          OPENAI_REASONING_EFFORT=medium
          AI_RESPONSE_MODE=mock
          EOF

      - name: Start Docker stack
        run: docker compose up --build -d

      - name: Wait for services
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:15050/health >/dev/null && \
               curl -fsS http://localhost:18000/health >/dev/null && \
               curl -fsS http://localhost:13000 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Services failed to become ready" >&2
          docker compose ps
          exit 1

      - name: Smoke-check portfolio analysis and SAR flow
        run: |
          curl -fsS http://localhost:15050/api/portfolios | tee /tmp/portfolios.json
          curl -fsS -X POST http://localhost:15050/api/portfolios/1/analyze | tee /tmp/analysis.json
          curl -fsS http://localhost:15050/api/cases | tee /tmp/cases.json
          curl -fsS http://localhost:15050/api/sar/1.json | tee /tmp/sar.json

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
