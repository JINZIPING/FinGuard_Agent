name: AI system tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      security_override:
        description: "Allow dependency vulnerability scan failures for this manual run"
        required: false
        type: boolean
        default: false
      override_reason:
        description: "Reason for override (required when security_override is true)"
        required: false
        type: string

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_system/requirements.txt

      - name: Install AI system test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_system/requirements.txt pytest pytest-cov pip-audit

      - name: Validate AI system security override reason
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.security_override }}
        run: |
          if [ -z "${{ inputs.override_reason }}" ]; then
            echo "override_reason is required when security_override=true"
            exit 1
          fi

      - name: Record AI system security override audit trail
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.security_override }}
        run: |
          echo "## Security Override Used" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: ai-system-tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Actor: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ inputs.override_reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run AI system dependency vulnerability scan
        continue-on-error: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.security_override) }}
        run: pip-audit -r ai_system/requirements.txt

      - name: Run AI system tests
        run: |
          pytest ai_system/tests -q \
            --junitxml=ai_system_test_results.xml \
            --cov=ai_system/app \
            --cov-report=term-missing \
            --cov-report=xml:ai_system_coverage.xml \
            --cov-report=html:ai_system_htmlcov

      - name: Upload AI system test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-system-test-report
          path: ai_system_test_results.xml

      - name: Upload AI system coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-system-coverage-report
          path: |
            ai_system_coverage.xml
            ai_system_htmlcov
