name: AI system tests

on:
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_system/requirements.txt

      - name: Install AI system test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_system/requirements.txt pytest

      - name: Run AI system tests
        run: pytest ai_system/tests -q
