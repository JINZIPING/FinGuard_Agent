name: AI system tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_system/requirements.txt

      - name: Install AI system test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_system/requirements.txt pytest

      - name: Run AI system tests
        run: pytest ai_system/tests -q --junitxml=ai_system_test_results.xml

      - name: Upload AI system test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-system-test-report
          path: ai_system_test_results.xml
