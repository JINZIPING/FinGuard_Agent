name: Integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ai_system/requirements.txt

      - name: Install integration test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r ai_system/requirements.txt pytest pytest-cov

      - name: Run integration tests
        run: |
          pytest integration_tests -q \
            --junitxml=integration_test_results.xml \
            --cov=backend/app \
            --cov=ai_system/app \
            --cov-report=term-missing \
            --cov-report=xml:integration_coverage.xml \
            --cov-report=html:integration_htmlcov

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: integration_test_results.xml

      - name: Upload integration coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage-report
          path: |
            integration_coverage.xml
            integration_htmlcov
